<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelorus</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #1e1e1e;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .container {
      display: flex;
      height: 100vh;
      width: 100vw;
    }
    .pane {
      flex: 1;
      border: none;
      background: #1e1e1e;
    }
    .pane-left {
      border-right: 2px solid #333;
    }
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .pane {
        flex: none;
        height: 50vh;
      }
      .pane-left {
        border-right: none;
        border-bottom: 2px solid #333;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <iframe class="pane pane-left" src="./pelorus/" allow="clipboard-read; clipboard-write"></iframe>
    <iframe class="pane pane-right" src="./selkies/" allow="clipboard-read; clipboard-write"></iframe>
  </div>
</body>
</html>
