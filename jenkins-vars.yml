---

# jenkins variables
project_name: docker-pelorus
external_type: github_stable
release_type: stable
release_tag: latest
ls_branch: master
build_armhf: false
repo_vars:
  - EXT_USER = 'linuxserver'
  - EXT_REPO = 'pelorus'
  - BUILD_VERSION_ARG = 'PELORUS_RELEASE'
  - LS_USER = 'linuxserver'
  - LS_REPO = 'docker-pelorus'
  - CONTAINER_NAME = 'pelorus'
  - DOCKERHUB_IMAGE = 'linuxserver/pelorus'
  - DEV_DOCKERHUB_IMAGE = 'lsiodev/pelorus'
  - PR_DOCKERHUB_IMAGE = 'lspipepr/pelorus'
  - DIST_IMAGE = 'arch'
  - MULTIARCH = 'false'
  - CI = 'true'
  - CI_WEB = 'true'
  - CI_PORT = '3001'
  - CI_SSL = 'true'
  - CI_DELAY = '120'
  - CI_WEB_SCREENSHOT_DELAY = '30'
  - CI_DOCKERENV = 'TZ=US/Pacific'
  - CI_AUTH = 'user:password'
  - CI_WEBPATH = ''
